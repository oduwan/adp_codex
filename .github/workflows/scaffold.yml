name: Portable qualification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Check CLI entry point
        run: adp --help
      - name: Validate plugin and docs scaffold
        run: python scripts/validate_scaffold.py
      - name: Fresh pinned archive and wheel installation
        run: python scripts/qualify_installation.py --source-ref "$(git rev-parse HEAD)" --evidence-dir "$RUNNER_TEMP/adp-install"
      - name: Test all accepted M1 through M5 and M6 qualification
        run: python scripts/qualify_m6.py --evidence-dir "$RUNNER_TEMP/adp-suite"
